# ============================================================
# TecSource · PostgreSQL local (desenvolvimento / feira)
# ------------------------------------------------------------
# Sobe um banco igual ao do Supabase, sem depender de internet:
#   docker compose up -d
#   DATABASE_URL=postgresql://postgres:tecsource@localhost:5432/tecsource
#   DATABASE_SSL=false
#   cd server && npm run db:setup
#
# O volume "pgdata" preserva os dados entre reinícios.
# ============================================================
services:
  db:
    image: postgres:16-alpine
    container_name: tecsource-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: tecsource
      POSTGRES_DB: tecsource
      TZ: America/Sao_Paulo
      PGTZ: America/Sao_Paulo
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tecsource"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
